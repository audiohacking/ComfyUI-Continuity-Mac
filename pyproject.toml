[project]
name = "continuity-metal"
version = "3.0.3"
description = "Apple Silicon fork of Continuity: one node for MiniMax H3, LTX 2.5 and the still families on Metal / MPS. Not the CUDA pack, and not an MLX / h3.c runner."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
# MacOS only. Do not declare "Environment :: GPU :: Apple Metal":
# Manager treats that as a hard match against the machine's reported
# accelerator, and Desktop often reports mps / nothing instead of that
# string — an M5 then looks like it has no Metal GPU. fp8-mps-metal
# (same publisher) ships with no accelerator list and installs fine.
classifiers = [
    "Operating System :: MacOS",
]

[project.urls]
Repository = "https://github.com/audiohacking/ComfyUI-Continuity-Mac"
"Bug Tracker" = "https://github.com/audiohacking/ComfyUI-Continuity-Mac/issues"

[tool.comfy]
PublisherId = "audiohacking"
DisplayName = "Continuity Metal"
Icon = "https://raw.githubusercontent.com/audiohacking/ComfyUI-Continuity-Mac/main/docs/img/icon.svg"
